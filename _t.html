<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>회귀 테스트 · pickle-mobile-chat</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
 body{font:12.5px/1.55 -apple-system,system-ui,sans-serif;margin:0;padding:0;background:#111;color:#eee}
 #result{padding:10px;white-space:pre-wrap;font-family:ui-monospace,Menlo,monospace;font-size:11.5px}
 .ok{color:#6ee7a0}.ng{color:#ff8a8a}.hdr{color:#ffd75e;font-weight:700}
 iframe{width:100%;height:70vh;border:1px solid #333;background:#fff}
</style>
</head>
<body>
<div id="result">테스트 준비 중…</div>
<iframe id="fr"></iframe>
<script>
(function(){
  var T=[];
  function wait(ms){ return new Promise(function(r){ setTimeout(r,ms); }); }
  function until(fn, ms){
    var t0=Date.now();
    return new Promise(function(res){
      (function tick(){
        var v=false; try{ v=!!fn(); }catch(e){}
        if(v || Date.now()-t0>ms) return res(v);
        setTimeout(tick,150);
      })();
    });
  }
  /* 버튼을 조건이 만족될 때까지(앱이 다른 동기화 중이면) 다시 눌러 준다 */
  function act(clickFn, pred, ms){
    var t0=Date.now();
    return new Promise(function(res){
      (function tick(){
        if(pred()) return res(true);
        if(Date.now()-t0>ms) return res(false);
        try{ clickFn(); }catch(e){}
        setTimeout(tick,1200);
      })();
    });
  }

  function boot(){
    return fetch('index.html?ts='+Date.now(),{cache:'no-store'}).then(function(r){ return r.text(); }).then(function(html){
      html=html.replace('<head>','<head>\n<script src="_mock.js?ts='+Date.now()+'"><\/script>\n');
      var fr=document.getElementById('fr');
      return new Promise(function(res){
        fr.onload=function(){ res(fr); };
        fr.srcdoc=html;
      });
    });
  }

  function run(){
    return boot().then(function(fr){
      var W=fr.contentWindow, D=fr.contentDocument;
      function list(){ return D.getElementById('list'); }
      function rows(){ return Array.prototype.slice.call(D.querySelectorAll('#list .row')); }
      function allText(){ return list()?list().textContent:''; }
      function log(ok,msg){ T.push((ok?'PASS':'FAIL')+' · '+msg); }
      function refresh(){ D.getElementById('refreshBtn').click(); }
      function moreBtn(){ return D.querySelector('#list button'); }
      function has(s){ return function(){ return allText().indexOf(s)>=0; }; }

      return until(function(){ return rows().length>0; }, 6000).then(function(){
        var v=D.querySelector('header h1 small');
        log(v && v.textContent==='v21','앱 버전 = '+(v?v.textContent:'?')+' (v21 기대)');
        log(/테스트 메시지 #1646/.test(allText()),'첫 로딩에 최신 글(#1646) 표시');
        log(rows().length>0,'첫 로딩 말풍선 '+rows().length+'개');
        log((W.__reqLog||[]).length<=4,'첫 로딩 요청 수 '+((W.__reqLog||[]).length)+'회 (전체 페이지 순회 없음)');
        var before=rows().length;

        /* 1) 최신 구간 재대조(90초 주기)를 새로고침으로 즉시 실행 → 최신 글이 사라지면 안 됨 */
        return act(refresh, has('테스트 메시지 #1646'), 6000).then(function(ok1){
          return wait(600).then(function(){
            log(ok1 && /테스트 메시지 #1646/.test(allText()),'새로고침(최신 구간 재대조) 후에도 최신 글 유지');
            log(rows().length>=before-1,'새로고침 후 말풍선 수 유지 ('+before+' → '+rows().length+')');

            /* 2) 폰에서 보내기 */
            D.getElementById('text').value='회귀테스트 전송';
            D.getElementById('send').click();
            return until(has('회귀테스트 전송'), 6000).then(function(shown){
              log(shown,'보낸 글이 화면에 남음');
              var me=rows().filter(function(r){ return r.classList.contains('me'); });
              var meTxt=me.length?me[me.length-1].textContent:'';
              log(/회귀테스트 전송/.test(meTxt),'내 글 말풍선이 [PC]/나 로 표시');

              /* 3) 새로고침해도 내가 보낸 글이 남아야 함 */
              return act(refresh, has('회귀테스트 전송'), 8000).then(function(kept){
                log(kept,'새로고침 후에도 내가 보낸 글 유지');

                /* 4) 남이 보낸 새 글 */
                W.mockAdd('[PC] 새로 온 알림');
                return act(refresh, has('새로 온 알림'), 8000).then(function(got){
                  log(got,'새로 들어온 글 표시');

                  /* 5) 이전 대화: 로컬 더 보기 → 서버에서 불러오기 */
                  function reveal(){
                    var b=moreBtn();
                    if(b && /이전 대화 더 보기/.test(b.textContent)){ b.click(); return wait(200).then(reveal); }
                  }
                  var b0=moreBtn();
                  log(!!b0,'이전 대화 버튼: '+(b0?b0.textContent:'없음'));
                  return reveal().then(function(){
                    var b=moreBtn();
                    log(!!b && /서버에서/.test(b.textContent),'로컬 다 보여준 뒤 = 서버에서 불러오기 ('+(b?b.textContent:'없음')+')');
                    return act(function(){ var x=moreBtn(); if(x) x.click(); }, has('테스트 메시지 #1399'), 12000);
                  }).then(function(older){
                    log(older,'서버에서 이전 대화 추가 로드(#1399 확인)');

                    /* 6) 위로 올린 상태에서 새 글 → 스크롤 유지 */
                    var L=list();
                    L.scrollTop=Math.max(0,L.scrollHeight-L.clientHeight-400);
                    var top0=L.scrollTop;
                    W.mockAdd('[PC] 스크롤 유지 확인용');
                    return act(refresh, has('스크롤 유지 확인용'), 8000).then(function(shown2){
                      var top1=L.scrollTop;
                      log(shown2,'스크롤 확인용 새 글도 표시');
                      log(Math.abs(top1-top0)<120,'위로 올린 상태에서 새 글 와도 스크롤 유지 ('+top0+' → '+top1+')');
                      log(W.__errs.length===0,'JS 오류 없음'+(W.__errs.length?(' → '+W.__errs.join(' / ')):''));
                      log(rows().length>0,'최종 렌더 행 수 '+rows().length);
                      window.__test=T;
                      return T;
                    });
                  });
                });
              });
            });
          });
        });
      });
    });
  }

  run().then(function(T){
    var ng=T.filter(function(x){ return x.indexOf('FAIL')===0; }).length;
    document.getElementById('result').innerHTML='<span class="hdr">'+(ng?('실패 '+ng+'건'):'전부 통과')+'</span>\n'+
      T.map(function(x){ return '<span class="'+(x.indexOf('PASS')===0?'ok':'ng')+'">'+x+'</span>'; }).join('\n');
  }).catch(function(e){
    document.getElementById('result').textContent='테스트 실행 오류: '+(e&&e.stack||e);
  });
})();
</script>
</body></html>
